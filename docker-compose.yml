services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - second_brain_network

  migrations:
    image: second-brain-gateway:${APP_VERSION:-v0.0.0}
    command: alembic upgrade head
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - second_brain_network

  gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/second-brain-gateway/Dockerfile
    image: second-brain-gateway:${APP_VERSION:-v0.0.0}
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      SIMILARITY_SEARCH_TOP_K: ${SIMILARITY_SEARCH_TOP_K}
      SIMILARITY_SEARCH_THRESHOLD: ${SIMILARITY_SEARCH_THRESHOLD}
      APP_API_PREFIX: ${APP_API_PREFIX}
      APP_VERSION: ${APP_VERSION:-v0.0.0}
      APP_ALLOW_ORIGINS: ${APP_ALLOW_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS}
    ports:
      - "8050:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - second_brain_network

volumes:
  postgres_data:

networks:
  second_brain_network:
    external: true
