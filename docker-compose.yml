services:
  db:
    image: postgres:16
    container_name: second_brain_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: second_brain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d second_brain"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: second_brain_gateway
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: second_brain
      DATABASE_USER: user
      DATABASE_PASSWORD: password
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - second_brain_network

networks:
  second_brain_network:
    driver: bridge

volumes:
  postgres_data:
