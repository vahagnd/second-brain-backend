[project]
name = "second-brain-db"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "numpy>=1.24.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "sentence-transformers>=2.2.0",
    "sqlalchemy>=2.0.49",
    "torch",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
