[project]
name = "second-brain-db"
dynamic = ["version"]
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.18.4",
    "numpy>=1.24.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "sentence-transformers>=2.2.0",
    "sqlalchemy>=2.0.49",
    "torch",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Build system
[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

# Dynamic version config
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
strict = true
fallback-version = "0.0.0"
format-jinja = """
{%- if distance == 0 -%}
  {{ base }}
{%- else -%}
  {{ base }}-{{ distance }}-g{{ commit[:7] }}
{%- endif -%}
"""
